name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m unittest discover -s tests -v
      - run: python -m keel_arena validate examples/synthetic-results.json
      - run: python -m keel_arena report examples/synthetic-results.json
      - run: python scripts/check_publication.py
      - run: python -m pip install --no-deps .
      - run: keel-arena validate examples/synthetic-results.json
      - run: git diff --check
