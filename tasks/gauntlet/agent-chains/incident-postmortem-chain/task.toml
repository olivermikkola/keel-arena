schema_version = "1.4"
[metadata]
category = "agent-chains"
difficulty = "medium"
source = "original-keel-arena"
split = "development"
judge_mode = "hybrid"
[agent]
timeout_sec = 330
network_mode = "allowlist"
allowed_hosts = []
[verifier]
timeout_sec = 60
user = "root"
environment_mode = "separate"
network_mode = "no-network"
[environment]
network_mode = "no-network"
cpus = 1
memory_mb = 512
storage_mb = 1024
workdir = "/workspace"
[[artifacts]]
source = "/workspace/postmortem.json"
destination = "postmortem.json"
[[artifacts]]
source = "/workspace/postmortem.md"
destination = "postmortem.md"
