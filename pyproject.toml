[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keel-arena"
version = "0.1.0"
description = "Reproducible coding-agent benchmark result validation and comparison"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
keel-arena = "keel_arena.__main__:main"

[tool.setuptools]
packages = ["keel_arena"]
