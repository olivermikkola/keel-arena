[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keel-arena"
version = "0.1.0"
description = "Edge AI and coding-agent benchmarking suite with 7-suite gauntlet, frontier LLM judge, hardware profiling, and SVG scorecards"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
harbor = ["harbor==0.26.0; python_version >= '3.12'"]

[project.scripts]
keel-arena = "keel_arena.__main__:main"

[tool.setuptools]
packages = ["keel_arena"]
